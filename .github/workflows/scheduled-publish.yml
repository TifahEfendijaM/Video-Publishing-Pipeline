name: Scheduled publish (Worker)

# Dispatched ONLY by the Cloudflare Worker for a claimed schedule occurrence (or its dispatch test).
# Running it by hand does nothing: the claim token is verified against the Worker's state first.
on:
  workflow_dispatch:
    inputs:
      occurrence_key:
        description: "Set by the scheduler. Do not run manually."
        required: true
      claim_token:
        description: "Set by the scheduler (single-use)."
        required: true
      config_version:
        description: "Set by the scheduler."
        required: true
      mode:
        description: "publish | dispatch_test (set by the scheduler)"
        required: true
        default: publish

permissions:
  contents: read

concurrency:
  group: easybosnian-publishing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Mask claim token
        run: echo "::add-mask::$CLAIM_TOKEN"
        env:
          CLAIM_TOKEN: ${{ inputs.claim_token }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        if: inputs.mode == 'publish'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Run
        run: npx tsx runner/src/main.ts scheduled
        env:
          OCCURRENCE_KEY: ${{ inputs.occurrence_key }}
          CLAIM_TOKEN: ${{ inputs.claim_token }}
          DISPATCH_MODE: ${{ inputs.mode }}
          STATE_API_URL: ${{ vars.STATE_API_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
