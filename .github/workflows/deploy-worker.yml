name: Deploy scheduler Worker

# Deploys the Cloudflare Worker (cron + dispatch + state API), applies D1 migrations, sets the Worker
# secrets from GitHub secrets, ensures the temporary-video R2 bucket + 1-day lifecycle rule, then reads
# the live configuration back into the run summary.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to deploy the Worker to Cloudflare.'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      DB_NAME: easybosnian-video-pipeline
      WORKER_NAME: easybosnian-video-scheduler
      KV_TITLE: easybosnian-video-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Tests must pass before deploying
        run: npm run typecheck && npm test

      - name: Check required settings
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GH_DISPATCH_TOKEN STATE_API_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: Ensure D1 database and generate deploy config
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const d=j.find(x=>x.name===process.env.DB_NAME);process.stdout.write(d?(d.uuid||d.id||""):"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create "$DB_NAME" >/dev/null
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const d=j.find(x=>x.name===process.env.DB_NAME);process.stdout.write(d?(d.uuid||d.id||""):"")})')
          fi
          [ -n "$id" ] || { echo "::error::could not resolve D1 database id"; exit 1; }
          kvlist() { npx wrangler kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("[")));const n=j.find(x=>x.title===process.env.KV_TITLE||x.title.endsWith("-"+process.env.KV_TITLE));process.stdout.write(n?n.id:"")})'; }
          kv=$(kvlist)
          if [ -z "$kv" ]; then npx wrangler kv namespace create "$KV_TITLE" >/dev/null; kv=$(kvlist); fi
          [ -n "$kv" ] || { echo "::error::could not resolve KV namespace id"; exit 1; }
          sed -e "s/__D1_DATABASE_ID__/$id/" -e "s/__KV_NAMESPACE_ID__/$kv/" worker/wrangler.toml > worker/wrangler.generated.toml
          echo "D1 database: $DB_NAME ($id); KV namespace: $KV_TITLE ($kv)"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote --config worker/wrangler.generated.toml

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy --config worker/wrangler.generated.toml | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set Worker secrets (values never printed)
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({GH_DISPATCH_TOKEN:process.env.GH_DISPATCH_TOKEN,STATE_API_TOKEN:process.env.STATE_API_TOKEN}))' \
            | npx wrangler secret bulk --config worker/wrangler.generated.toml

      - name: Optional R2 bucket for videos over 24 MB (only if R2_BUCKET is set)
        if: env.R2_BUCKET != ''
        run: |
          npx wrangler r2 bucket create "$R2_BUCKET" 2>&1 | grep -v -i "already exists" || true
          npx wrangler r2 bucket lifecycle add "$R2_BUCKET" expire-tmp tmp/ --expire-days 1 --abort-multipart-days 1 -y 2>&1 || echo "lifecycle rule may already exist"
          npx wrangler r2 bucket lifecycle list "$R2_BUCKET"

      - name: Read back live configuration
        env:
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Live Worker configuration"
            echo ""
            echo "- Worker URL: \`${WORKER_URL:-unknown}\` (set this as repository variable \`STATE_API_URL\`)"
            echo ""
            echo "### Cron triggers (Cloudflare API)"
            echo '```json'
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(JSON.stringify({success:j.success,schedules:j.result?.schedules},null,2))})'
            echo '```'
            echo "### Deployments"
            echo '```text'
            npx wrangler deployments list --config worker/wrangler.generated.toml 2>/dev/null | tail -n 25
            echo '```'
            echo "### Secret names (values are never shown)"
            echo '```text'
            npx wrangler secret list --config worker/wrangler.generated.toml 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).map(x=>x.name).join("\n"))}catch{console.log("(unavailable)")}})'
            echo '```'
            if [ -n "$WORKER_URL" ]; then
              echo "### Health and dispatch target"
              echo '```json'
              curl -sS "$WORKER_URL/health"; echo
              curl -sS -H "Authorization: Bearer $STATE_API_TOKEN" "$WORKER_URL/api/target"; echo
              curl -sS -H "Authorization: Bearer $STATE_API_TOKEN" "$WORKER_URL/api/state" \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(JSON.stringify({settings:j.settings,nextOccurrences:j.nextOccurrences,nextOccurrencesIfEnabled:j.nextOccurrencesIfEnabled},null,2))})'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
