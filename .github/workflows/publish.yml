name: Publish video

# The main human control. GitHub shows every field; fields that don't apply to the chosen
# run_mode / video_selection are ignored (and the run summary says so).
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "manual_now = publish one video now (choose below whether to keep or stop automation). automated = Create/Edit/Delete/List named scheduled jobs; never publishes immediately."
        type: choice
        required: true
        options: [manual_now, automated]
        default: automated
      manual_schedule_action:
        description: "Manual now only: keep_schedule leaves existing automation/settings unchanged (default); stop_schedule stops all scheduled jobs before this upload. Ignored for automated."
        type: choice
        required: true
        default: keep_schedule
        options: [keep_schedule, stop_schedule]
      job_action:
        description: "Scheduled jobs only: create adds a new independent job; edit changes one; delete removes one; list reports all jobs and remaining Custom titles."
        type: choice
        default: list
        required: true
        options: [list, create, edit, delete]
      job_name:
        description: "Create: unique new job name. Edit/Delete: existing name or ID from List jobs. Ignored for List/manual."
        type: string
        required: false
      video_rule:
        description: 'Scheduled rule only: plain English, e.g. Pick a random video whose title ends with [available]. Blank on Edit retains its interpreted rule.'
        type: string
        required: false
      video_selection:
        description: "keep_existing = retain saved rule on Edit. fifo/lifo/random = automatic. custom = exact filename (manual) or ordered list (scheduled). rule = plain English (scheduled)."
        type: choice
        required: true
        default: keep_existing
        options: [keep_existing, fifo, lifo, random, custom, rule]
      custom_video_name:
        description: "Manual: one exact filename. Scheduled Custom: comma-separated exact filenames in order; quote names containing commas. Blank on Edit retains the remaining list."
        type: string
        required: false
      schedule:
        description: "Weekly Europe/Sarajevo times, e.g. Mon 06:00; Wed 17:00; Fri 21:00. Create: required. Edit: blank keeps this job's times. Ignored for Delete/List/manual."
        type: string
        required: false
      outro_youtube:
        description: "Outro for YouTube (both the video and the Short): full filename of a clip in the Drive folder. manual_now: this video only. automated: saved for this job. Empty = saved outro (default: the clip named outro). Type none for no outro."
        type: string
        required: false
      outro_tiktok:
        description: "Outro for TikTok: full filename of a clip in the Drive folder. manual_now: this video only. automated: saved for this job. Empty = saved outro (default: the clip named outro). Type none for no outro."
        type: string
        required: false
      outro_instagram:
        description: "Outro for the Instagram Reel: full filename of a clip in the Drive folder. manual_now: this video only. automated: saved for this job. Empty = saved outro (default: the clip named outro). Type none for no outro."
        type: string
        required: false
      outro_facebook:
        description: "Outro for the Facebook video: full filename of a clip in the Drive folder. manual_now: this video only. automated: saved for this job. Empty = saved outro (default: the clip named outro). Type none for no outro."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: easybosnian-publishing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Run
        run: npx tsx runner/src/main.ts configure
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          JOB_ACTION: ${{ inputs.job_action }}
          JOB_NAME: ${{ inputs.job_name }}
          VIDEO_RULE: ${{ inputs.video_rule }}
          MANUAL_SCHEDULE_ACTION: ${{ inputs.manual_schedule_action }}
          VIDEO_SELECTION: ${{ inputs.video_selection }}
          CUSTOM_VIDEO_NAME: ${{ inputs.custom_video_name }}
          SCHEDULE_TEXT: ${{ inputs.schedule }}
          OUTRO_YOUTUBE: ${{ inputs.outro_youtube }}
          OUTRO_TIKTOK: ${{ inputs.outro_tiktok }}
          OUTRO_INSTAGRAM: ${{ inputs.outro_instagram }}
          OUTRO_FACEBOOK: ${{ inputs.outro_facebook }}
          STATE_API_URL: ${{ vars.STATE_API_URL }}
          PUBLISHED_DRIVE_FOLDER_ID: ${{ vars.PUBLISHED_DRIVE_FOLDER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
