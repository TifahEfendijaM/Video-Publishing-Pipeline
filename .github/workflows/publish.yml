name: Publish video

# The main human control. GitHub shows every field; fields that don't apply to the chosen
# run_mode / plan_action are ignored (and the run summary says so).
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "automated = Edit/Pause/Resume the publishing plan; never publishes immediately. manual_now = publish one video now."
        type: choice
        required: true
        options: [automated, manual_now]
        default: automated
      plan_action:
        description: "Scheduled plan only: Edit saves the complete plan (blank retains it and reports settings). Pause/Resume retain all rules and Custom progress."
        type: choice
        default: edit
        required: true
        options: [edit, pause, resume]
      publishing_plan:
        description: 'Scheduled Edit only. Pair times and rules, separated by | or newlines. Example: Mon and Wed 06:00: lifo | Fri 21:00: random | Sun 18:00: custom: "Video A.mp4", "Video B.mp4". All times Europe/Sarajevo.'
        type: string
        required: false
      video_selection:
        description: 'Manual only: enter fifo, lifo, random, a plain-English title rule, or custom: "Exact filename.mp4". Blank uses the saved one-off default. Scheduled selection belongs inside publishing_plan.'
        type: string
        required: false
      manual_schedule_action:
        description: "Manual only: keep_schedule leaves the plan unchanged (default); pause_schedule pauses it before this upload. Resume later with the plan action."
        type: choice
        required: true
        default: keep_schedule
        options: [keep_schedule, pause_schedule]
      outro_youtube:
        description: "Outro for YouTube (both the video and the Short): full filename of a clip in the Drive folder. manual_now: this video only. automated Edit: saved for the whole plan. Empty = saved outro (default: the clip named outro). Type none for no outro."
        type: string
        required: false
      outro_tiktok:
        description: "Outro for TikTok: full filename of a clip in the Drive folder. manual_now: this video only. automated Edit: saved for the whole plan. Empty = saved outro (default: the clip named outro). Type none for no outro."
        type: string
        required: false
      outro_instagram:
        description: "Outro for the Instagram Reel: full filename of a clip in the Drive folder. manual_now: this video only. automated Edit: saved for the whole plan. Empty = saved outro (default: the clip named outro). Type none for no outro."
        type: string
        required: false
      outro_facebook:
        description: "Outro for the Facebook video: full filename of a clip in the Drive folder. manual_now: this video only. automated Edit: saved for the whole plan. Empty = saved outro (default: the clip named outro). Type none for no outro."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: easybosnian-publishing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        if: inputs.run_mode == 'manual_now'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Run
        run: npx tsx runner/src/main.ts configure
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          PLAN_ACTION: ${{ inputs.plan_action }}
          PUBLISHING_PLAN: ${{ inputs.publishing_plan }}
          MANUAL_SCHEDULE_ACTION: ${{ inputs.manual_schedule_action }}
          VIDEO_SELECTION: ${{ inputs.video_selection }}
          OUTRO_YOUTUBE: ${{ inputs.outro_youtube }}
          OUTRO_TIKTOK: ${{ inputs.outro_tiktok }}
          OUTRO_INSTAGRAM: ${{ inputs.outro_instagram }}
          OUTRO_FACEBOOK: ${{ inputs.outro_facebook }}
          STATE_API_URL: ${{ vars.STATE_API_URL }}
          PUBLISHED_DRIVE_FOLDER_ID: ${{ vars.PUBLISHED_DRIVE_FOLDER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
