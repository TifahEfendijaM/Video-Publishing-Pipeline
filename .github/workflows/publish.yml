name: Publish video

# The main human control. GitHub shows every field; fields that don't apply to the chosen
# run_mode / plan_action are ignored (and the run summary says so).
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "automated = Edit/Pause/Resume the publishing plan; never publishes immediately. manual_now = publish one video now."
        type: choice
        required: true
        options: [automated, manual_now]
        default: automated
      plan_action:
        description: "Scheduled plan only: Edit saves the complete plan (blank retains it and reports settings). Pause/Resume retain all rules and Custom progress."
        type: choice
        default: edit
        required: true
        options: [edit, pause, resume]
      publishing_plan:
        description: 'Scheduled Edit: describe the complete plan naturally, with exact filenames and times. Example: Upload "Video.mp4" tonight at 21:00 without an outro, then newest first every third day from tomorrow at 18:00 with "End.mp4". Codex interprets natural text during this run. Formatted plans skip AI. All times Sarajevo.'
        type: string
        required: false
      video_selection:
        description: 'Manual only: describe one video and outro naturally, or use custom: "Video.mp4"; outro: none for an instant entry. Codex interprets natural text during this run. Blank uses saved defaults. One shared outro for all platforms.'
        type: string
        required: false
      manual_schedule_action:
        description: "Manual only: keep_schedule leaves the plan unchanged (default); pause_schedule pauses it before this upload. Resume later with the plan action."
        type: choice
        required: true
        default: keep_schedule
        options: [keep_schedule, pause_schedule]

permissions:
  contents: read

# Serialize account refresh and publishing across all three workflow entry points.
concurrency:
  group: easybosnian-publishing
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'TifahEfendijaM/Video-Publishing-Pipeline' && github.repository_id == '1407843658' && github.repository_owner_id == '50710040' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        if: inputs.run_mode == 'manual_now'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Install subscription Codex CLI
        if: inputs.run_mode == 'manual_now' || (inputs.plan_action == 'edit' && inputs.publishing_plan != '')
        run: npm install --global @openai/codex@0.160.0
      - name: Interpret and validate input on demand
        id: prepare
        run: npx tsx runner/src/main.ts prepare-input
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          PLAN_ACTION: ${{ inputs.plan_action }}
          PUBLISHING_PLAN: ${{ inputs.publishing_plan }}
          VIDEO_SELECTION: ${{ inputs.video_selection }}
          STATE_API_URL: ${{ vars.STATE_API_URL }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          VIDEO_CODEX_AUTH_JSON: ${{ secrets.VIDEO_CODEX_AUTH_JSON }}
          VIDEO_CODEX_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run
        run: npx tsx runner/src/main.ts configure
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          PLAN_ACTION: ${{ inputs.plan_action }}
          PUBLISHING_PLAN: ${{ steps.prepare.outputs.publishing_plan }}
          EXPECTED_PLAN_REVISION: ${{ steps.prepare.outputs.expected_plan_revision }}
          MANUAL_SCHEDULE_ACTION: ${{ inputs.manual_schedule_action }}
          VIDEO_SELECTION: ${{ steps.prepare.outputs.video_selection }}
          STATE_API_URL: ${{ vars.STATE_API_URL }}
          PUBLISHED_DRIVE_FOLDER_ID: ${{ vars.PUBLISHED_DRIVE_FOLDER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          VIDEO_CODEX_AUTH_JSON: ${{ secrets.VIDEO_CODEX_AUTH_JSON }}
          VIDEO_CODEX_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GITHUB_TOKEN: ${{ github.token }}
