name: Publish video

# The main human control. GitHub shows every field; fields that don't apply to the chosen
# run_mode / plan_action are ignored (and the run summary says so).
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "automated = Edit/Pause/Resume the publishing plan; never publishes immediately. manual_now = publish one video now."
        type: choice
        required: true
        options: [automated, manual_now]
        default: automated
      plan_action:
        description: "Scheduled plan only: Edit saves the complete plan (blank retains it and reports settings). Pause/Resume retain all rules and Custom progress."
        type: choice
        default: edit
        required: true
        options: [edit, pause, resume]
      publishing_plan:
        description: 'Scheduled Edit: describe the complete plan naturally, with exact filenames and times. Example: Upload "Video.mp4" tonight at 21:00 without an outro, then newest first every third day from tomorrow at 18:00 with "End.mp4". ChatGPT preparation may take up to 70 minutes. Formatted plans remain instant. All times Sarajevo.'
        type: string
        required: false
      video_selection:
        description: 'Manual only: describe one video and outro naturally, or use custom: "Video.mp4"; outro: none for an instant entry. Natural text waits for hourly ChatGPT preparation before uploading. Blank uses saved defaults. One shared outro for all platforms.'
        type: string
        required: false
      manual_schedule_action:
        description: "Manual only: keep_schedule leaves the plan unchanged (default); pause_schedule pauses it before this upload. Resume later with the plan action."
        type: choice
        required: true
        default: keep_schedule
        options: [keep_schedule, pause_schedule]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      requires_cloud: ${{ steps.inspect.outputs.requires_cloud }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: inspect
        run: npx tsx runner/src/main.ts inspect-input
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          PLAN_ACTION: ${{ inputs.plan_action }}
          PUBLISHING_PLAN: ${{ inputs.publishing_plan }}
          VIDEO_SELECTION: ${{ inputs.video_selection }}
  prepare:
    needs: inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    concurrency:
      group: ${{ needs.inspect.outputs.requires_cloud == 'true' && 'easybosnian-ai-preparation' || format('instant-input-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      publishing_plan: ${{ steps.prepare.outputs.publishing_plan }}
      video_selection: ${{ steps.prepare.outputs.video_selection }}
      expected_plan_revision: ${{ steps.prepare.outputs.expected_plan_revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare input without blocking scheduled uploads
        id: prepare
        run: npx tsx runner/src/main.ts prepare-input
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          PLAN_ACTION: ${{ inputs.plan_action }}
          PUBLISHING_PLAN: ${{ inputs.publishing_plan }}
          VIDEO_SELECTION: ${{ inputs.video_selection }}
          STATE_API_URL: ${{ vars.STATE_API_URL }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
  run:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: easybosnian-publishing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        if: inputs.run_mode == 'manual_now'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Run
        run: npx tsx runner/src/main.ts configure
        env:
          RUN_MODE: ${{ inputs.run_mode }}
          PLAN_ACTION: ${{ inputs.plan_action }}
          PUBLISHING_PLAN: ${{ needs.prepare.outputs.publishing_plan }}
          EXPECTED_PLAN_REVISION: ${{ needs.prepare.outputs.expected_plan_revision }}
          MANUAL_SCHEDULE_ACTION: ${{ inputs.manual_schedule_action }}
          VIDEO_SELECTION: ${{ needs.prepare.outputs.video_selection }}
          STATE_API_URL: ${{ vars.STATE_API_URL }}
          PUBLISHED_DRIVE_FOLDER_ID: ${{ vars.PUBLISHED_DRIVE_FOLDER_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
